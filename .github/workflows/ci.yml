name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quick:
    # The recorded numeric environment is macOS on arm64 (the env_machine and
    # env_platform claims in data/claims.json). The suite asserts the live
    # machine architecture against that record, and the published cover is
    # byte-compared with its generator only on the recording architecture, so
    # the hosted quick profile runs on Apple-silicon macOS runners rather than
    # x86_64 Linux, where those provenance checks fail by design.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        id: setup_uv
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Expose pinned uv to the release verifier
        env:
          RELEASE_UV_BINARY: ${{ steps.setup_uv.outputs.uv-path }}
        run: |
          test -x "$RELEASE_UV_BINARY"
          mkdir -p "${HOME}/.local/bin"
          test ! -e "${HOME}/.local/bin/uv"
          test ! -L "${HOME}/.local/bin/uv"
          ln -s "$RELEASE_UV_BINARY" "${HOME}/.local/bin/uv"
          "${HOME}/.local/bin/uv" --version

      - name: Install Pandoc and ripgrep for the portable documentation and formal checks
        run: |
          brew install pandoc ripgrep
          pandoc --version
          rg --version

      - name: Sync locked environment
        run: uv sync --locked --extra dev

      - name: Run quick receipt
        run: .venv/bin/python -I -S scripts/verify_release.py quick

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-release-receipt
          path: output/reports/

  gnn-interop:
    name: gnn conformance (pinned v5.0.3)
    # The upstream parser is an optional extra in ordinary development, so the
    # quick profile skips these checks. This job provisions the pinned release
    # checkout and the gnn-interop extra and then requires them: under
    # AILM_REQUIRE_GNN_INTEROP a missing prerequisite fails instead of skipping,
    # which is what keeps "expressed in GNN" enforced rather than only asserted.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install uv and Python
        uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3
        with:
          version: "0.12.0"
          python-version: "3.12"
          enable-cache: true
          cache-dependency-glob: uv.lock

      - name: Check out the pinned upstream GNN release
        run: |
          set -euo pipefail
          PIN=gnn/upstream.json
          PY=$(uv python find --no-project 3.12)
          REPO=$("$PY" -c "import json;print(json.load(open('$PIN'))['repository'])")
          TAG=$("$PY" -c "import json;print(json.load(open('$PIN'))['tag'])")
          COMMIT=$("$PY" -c "import json;print(json.load(open('$PIN'))['commit'])")
          # The checkout follows gnn/upstream.json; a pin bump re-points it.
          git clone --depth 1 --branch "$TAG" "$REPO" ../ailm-gnn-v5.0.3
          test "$(git -C ../ailm-gnn-v5.0.3 rev-parse HEAD)" = "$COMMIT"

      - name: Sync the locked environment with the interop extra
        run: uv sync --locked --extra dev --extra gnn-interop

      - name: Verify and require the pinned upstream release
        env:
          AILM_REQUIRE_GNN_INTEROP: "1"
        run: |
          export AILM_GNN_UPSTREAM="$(cd ../ailm-gnn-v5.0.3 && pwd)"
          .venv/bin/python scripts/verify_gnn_release.py
          .venv/bin/python -m pytest tests/test_gnn_conformance.py -q --no-cov

# Hosted CI deliberately stops at the quick profile. Full publication acceptance
# consumes the ignored, machine-local external-call cache, rechecks a sample
# against a reachable Ollama server serving every declared probe, and uses an
# exact clean docxology/template checkout routed to this sidecar. It then requires
# Lean, TeX, qpdf, Pandoc, and the template validator. A hosted job without those
# inputs can only fail or skip; neither result is publication evidence. Run the
# documented full command from a prepared release workstation.
