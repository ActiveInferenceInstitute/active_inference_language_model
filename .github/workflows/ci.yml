name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# One job per arm. Every arm is a profile of scripts/verify_release.py, so the
# hosted command and the local command are the same string; no job repeats a
# command another job already runs (format, lint, typing, the documentation
# checks, and the test selections are each owned by exactly one arm), and the
# environment every arm needs is defined once in .github/actions/setup-ailm.
#
# Hosted CI deliberately stops at these arms. Full publication acceptance
# consumes the ignored, machine-local external-call cache, rechecks a sample
# against a reachable Ollama server serving every declared probe, and uses an
# exact clean docxology/template checkout routed to this sidecar. It then requires
# Lean, TeX, qpdf, Pandoc, and the template validator. A hosted job without those
# inputs can only fail or skip; neither result is publication evidence. Run the
# documented full command from a prepared release workstation.

jobs:
  lint:
    name: lint
    # Format and lint only; the typing arm owns mypy.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the gate environment
        uses: ./.github/actions/setup-ailm

      - name: Run the lint arm
        run: .venv/bin/python -I -S scripts/verify_release.py lint

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: lint-release-receipt
          path: output/reports/

  types:
    name: types
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the gate environment
        uses: ./.github/actions/setup-ailm

      - name: Run the types arm
        run: .venv/bin/python -I -S scripts/verify_release.py types

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: types-release-receipt
          path: output/reports/

  docs:
    name: docs
    # The documentation index, its relative links, and the hydrated mirror. The
    # portable protocol bundle needs the template renderer's output, so it stays
    # a full-profile step rather than a hosted one.
    runs-on: macos-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the gate environment
        uses: ./.github/actions/setup-ailm

      - name: Run the docs arm
        run: .venv/bin/python -I -S scripts/verify_release.py docs

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: docs-release-receipt
          path: output/reports/

  quick:
    # The recorded numeric environment is macOS on arm64 (the env_machine and
    # env_platform claims in data/claims.json). The suite asserts the live
    # machine architecture against that record, and the published cover is
    # byte-compared with its generator only on the recording architecture, so
    # the hosted quick profile runs on Apple-silicon macOS runners rather than
    # x86_64 Linux, where those provenance checks fail by design.
    runs-on: macos-latest
    timeout-minutes: 90
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the gate environment
        uses: ./.github/actions/setup-ailm
        with:
          # Pandoc and ripgrep: the portable suite's destination proofs and the
          # formal vacuity control shell out to the real tools.
          tools: pandoc ripgrep

      - name: Run quick receipt
        run: .venv/bin/python -I -S scripts/verify_release.py quick

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: quick-release-receipt
          path: output/reports/

  measurement:
    name: measurement gate
    # The four slowest end-to-end measurement files move here from quick: they
    # measured 903.9 s of 2338 s of quick test time. This job has its own
    # watchdog (2100 s step inside a 45-minute job), its own receipt, and its
    # own check row, so a wedge in a measurement gate cannot consume the quick
    # step's budget. The job is deliberately not a ruleset requirement: the
    # owner decided quick and measurement stay unrequired on 2026-11-05. It runs
    # no format, lint, or typing step: the lint and types arms own those, and a
    # second copy here would gate the same bytes twice.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the gate environment
        uses: ./.github/actions/setup-ailm

      - name: Run measurement receipt
        run: .venv/bin/python -I -S scripts/verify_release.py measurement

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: measurement-release-receipt
          path: output/reports/

  contract:
    name: contract gate
    # The two slowest self-contained non-measurement files move here: wheel
    # builds in subprocesses and real-socket retry waits. The 2026-11-04
    # full-suite duration profile attributed 270.8 s to them in-suite; this
    # profile's first local run measured 168.6 s for the same 117 tests. The
    # 2100 s step watchdog is set against the slower 325.5 s hosted projection
    # (15.5% of the budget). This job has its own receipt and its own check row,
    # so a wheel build cannot consume the quick step's budget. Deliberately not
    # a ruleset requirement, and it runs no format, lint, or typing step.
    runs-on: macos-latest
    timeout-minutes: 45
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the gate environment
        uses: ./.github/actions/setup-ailm

      - name: Run contract receipt
        run: .venv/bin/python -I -S scripts/verify_release.py contract

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: contract-release-receipt
          path: output/reports/

  gnn-interop:
    name: gnn conformance (pinned)
    # The upstream parser is an optional extra in ordinary development, so the
    # quick profile skips these checks. This arm provisions the pinned release
    # checkout and the gnn-interop extra and then requires them: under
    # AILM_REQUIRE_GNN_INTEROP a missing prerequisite fails instead of skipping,
    # which is what keeps "expressed in GNN" enforced rather than only asserted.
    # The checkout is materialized by scripts/fetch_gnn_upstream.py from
    # gnn/upstream.json into the ignored refs/ tree, the same command a local run
    # uses; see .github/GNN.md for what the conformance step parses.
    runs-on: macos-latest
    timeout-minutes: 60
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up the gate environment with the interop extra
        uses: ./.github/actions/setup-ailm
        with:
          extras: dev gnn-interop

      - name: Run the GNN conformance arm
        run: .venv/bin/python -I -S scripts/verify_release.py gnn

      - name: Upload receipt
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: gnn-release-receipt
          path: output/reports/
