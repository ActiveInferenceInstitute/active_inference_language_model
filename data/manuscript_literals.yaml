# Declared manuscript variables that are not measured results.
#
# Measurements belong in data/claims.json and are written only by recorders.
# This file owns decision-log locators and search-protocol metadata that the
# manuscript must inject but for which no measured run exists. Deposited-source
# metadata and locators come directly from data/reference_sources.json; frozen
# executable constants come directly from their code registries. The generator
# parses this schema, validates every entry, and inserts each key through the
# same collision-refusing token map as claims. It is therefore a real source of
# values, not a value-global exemption list. Literature-search metadata has its
# own evidence record in data/literature_search.json and is not duplicated here.

